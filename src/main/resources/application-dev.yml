server:
  port: ${SERVER_PORT:8056}

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/iotmining
    username: postgres
    password: 8506
    hikari:
      pool-name: DeviceProfileServicePool-Dev
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 2000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database: postgresql
    show-sql: true

  jackson:
    default-property-inclusion: non_null

# --- External Services ---
# Ensure these match the variables in your iiotedge-cli.sh script
services:
  device-service:
    url: ${SERVICES_DEVICE_SERVICE_URL:http://localhost:8055}
